spring:
  application:
    name: hirelink-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 6MB

jwt:
  secret: ${JWT_SECRET}
  issuer: hirelink

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

storage:
  supabase:
    url: ${SUPABASE_URL:}
    secret-key: ${SUPABASE_SECRET_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:profile-images}

business-registration:
  nts:
    service-key: ${NTS_SERVICE_KEY:}
  paddle:
    url: ${PADDLE_OCR_URL:http://localhost:8091/recognize}

sms:
  solapi:
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender-number: ${SOLAPI_SENDER_NUMBER:}

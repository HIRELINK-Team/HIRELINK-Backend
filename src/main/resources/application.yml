spring:
  application:
    name: hirelink-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  issuer: hirelink

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

storage:
  supabase:
    url: ${SUPABASE_URL:}
    secret-key: ${SUPABASE_SECRET_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:profile-images}

business-registration:
  nts:
    service-key: ${NTS_SERVICE_KEY:}

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:true}
        same-site: lax
        path: /api/auth/social

spring:
  application:
    name: hirelink-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 6MB

jwt:
  secret: ${JWT_SECRET}
  issuer: hirelink

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
  social:
    enabled: ${SOCIAL_LOGIN_ENABLED:false}
    callback-base-url: ${SOCIAL_CALLBACK_BASE_URL:}
    frontend-redirect-uri: ${SOCIAL_FRONTEND_REDIRECT_URI:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuer-uri: https://accounts.google.com
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      issuer-uri: https://kauth.kakao.com

storage:
  supabase:
    url: ${SUPABASE_URL:}
    secret-key: ${SUPABASE_SECRET_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:profile-images}

business-registration:
  nts:
    service-key: ${NTS_SERVICE_KEY:}
  paddle:
    url: ${PADDLE_OCR_URL:http://localhost:8091/recognize}

sms:
  solapi:
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender-number: ${SOLAPI_SENDER_NUMBER:}

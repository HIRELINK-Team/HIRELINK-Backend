spring:
  application:
    name: hirelink-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  issuer: hirelink

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

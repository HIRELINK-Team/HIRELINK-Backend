name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify Gradle Wrapper execution permission
        run: test -x ./gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Test OCR request handling and field extraction
        run: |
          python3 -m venv /tmp/ocr-test-venv
          /tmp/ocr-test-venv/bin/pip install -r ocr/requirements-test.txt
          cd ocr
          /tmp/ocr-test-venv/bin/python -m unittest discover -s tests

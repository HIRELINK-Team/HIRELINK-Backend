name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      current: ${{ steps.release.outputs.current }}
    steps:
      - name: Select the tested main revision
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$RELEASE_SHA" != "$latest_sha" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer main revision exists; skipping this deployment."
            exit 0
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$RELEASE_SHA&per_page=1" --jq '.workflow_runs[0].conclusion')
          if [[ "$conclusion" != "success" ]]; then
            echo "The main revision must pass CI before deployment."
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "current=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
          - service: ocr
            context: ./ocr
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hirelink-team/hirelink-${{ matrix.service }}:${{ needs.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [prepare, publish]
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-duration-seconds: 1800
          mask-aws-account-id: true

      - name: Deploy through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          sha = os.environ["RELEASE_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha)
          command = f'''set -eu
          exec 9>/run/hirelink-deploy.lock
          flock -n 9
          cd /home/ubuntu/HIRELINK-Backend
          test -z "$(runuser -u ubuntu -- git status --porcelain)"
          test "$(runuser -u ubuntu -- git branch --show-current)" = main
          runuser -u ubuntu -- git fetch --quiet origin main
          if [ "$(runuser -u ubuntu -- git rev-parse origin/main)" != "{sha}" ]; then
            echo SKIPPED_NEWER_MAIN
            exit 0
          fi
          runuser -u ubuntu -- git merge --ff-only "{sha}" >/dev/null
          bash deploy/update.sh "{sha}"
          '''
          payload = {"commands": [command], "executionTimeout": ["600"]}
          path = Path(os.environ["RUNNER_TEMP"]) / "deploy-command.json"
          path.write_text(json.dumps(payload))
          PY
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "file://$RUNNER_TEMP/deploy-command.json" \
            --timeout-seconds 120 \
            --query Command.CommandId --output text)
          for ((attempt = 0; attempt < 150; attempt++)); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null) || status=Pending
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed. Check the command result in Systems Manager."
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for the deployment result."
          exit 1

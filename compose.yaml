services:
  db:
    image: postgres:17-alpine
    container_name: hirelink-postgres
    environment:
      POSTGRES_DB: hirelink
      POSTGRES_USER: hirelink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hirelink-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirelink -d hirelink"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr:
    profiles: ["ocr"]
    build: ./ocr
    ports:
      - "127.0.0.1:8091:8000"
    networks:
      - ocr-local
    cpus: 2
    mem_limit: 2g
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"

networks:
  ocr-local:
    driver: bridge

volumes:
  hirelink-postgres-data:
